name: Generate GitHub Statistics

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and Generate Statistics
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python scripts/generate_stats.py
      
      - name: Verify SVGs
        run: |
          if [ ! -f "assets/github/overview.dark.svg" ]; then
            echo "Error: overview.dark.svg was not generated."
            exit 1
          fi
          if [ ! -f "assets/github/overview.light.svg" ]; then
            echo "Error: overview.light.svg was not generated."
            exit 1
          fi
          echo "SVGs verified successfully."

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/github/*.svg
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update github statistics svgs [skip ci]"
            git push
          fi

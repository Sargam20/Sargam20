name: Generate GitHub Statistics

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch: # Manual trigger for debugging/updates

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate Statistics SVG
        env:
          # Use GITHUB_TOKEN for public repo data. If broader private contribution access
          # is needed, configure a repository Actions Secret or GitHub App and map it here instead.
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p assets/github
          python scripts/generate_stats.py

      - name: Commit and Push SVGs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/github/*.svg
          # Only commit if SVGs have been modified (prevents empty commits if data hasn't changed or generation failed)
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update GitHub statistics dashboard"
            git push
          fi

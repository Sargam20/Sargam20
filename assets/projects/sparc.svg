<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <title>SPARC Mobility Scorecard Thumbnail</title>
  <style>
    .bg { fill: #0D1117; stroke: #21262D; stroke-width: 1; rx: 8; }
    .label { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 700; fill: #8B949E; letter-spacing: 1.5px; }
    .title { font-family: Inter, ui-sans-serif, sans-serif; font-size: 20px; font-weight: 700; fill: #F0F6FC; }
    .accent { fill: #22D3EE; }
  </style>
  <rect class="bg" width="398" height="198" x="1" y="1" />
  
  <g opacity="0.1" stroke="#22D3EE" stroke-width="1">
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="320" y1="0" x2="320" y2="200" />
    <circle cx="320" cy="160" r="3" fill="#22D3EE" />
  </g>

  <g transform="translate(30, 40)">
    <rect x="0" y="-12" width="24" height="4" class="accent" />
    <text x="0" y="15" class="label">URBAN ANALYTICS</text>
    <text x="0" y="50" class="title">SPARC Scorecard</text>
    <text x="0" y="75" class="label" fill="#58A6FF">INTELLIGENT DASHBOARD</text>
  </g>
  
  <g transform="translate(30, 150)">
    <text x="0" y="0" class="label" opacity="0.8">DATA SCIENCE • PYTHON • UI/UX</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350">
  <title>Sargam Sharma — Data Science, AI/ML, Research and Full-Stack Engineering</title>
  <desc>A visual hero banner presenting Sargam Sharma's profile identity: Data x AI x Research x Systems.</desc>
  <style>
    .bg { fill: #FFFFFF; }
    .grid { stroke: #F0F6FC; stroke-width: 1; }
    .title { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #24292F; letter-spacing: 2px; }
    .subtitle { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 14px; font-weight: 600; fill: #0969DA; letter-spacing: 1.5px; }
    .desc { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #57606A; }
    .badge-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11px; font-weight: 600; fill: #24292F; letter-spacing: 1px; }
    .badge-bg { fill: #F6F8FA; stroke: #D0D7DE; stroke-width: 1; rx: 4; }
    .node { fill: #0969DA; }
    .link { stroke: #0969DA; stroke-width: 1.5; opacity: 0.3; }
  </style>

  <!-- Background -->
  <rect class="bg" width="900" height="350" />

  <!-- Grid -->
  <g class="grid">
    <line x1="0" y1="50" x2="900" y2="50" />
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="150" x2="900" y2="150" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="0" y1="250" x2="900" y2="250" />
    <line x1="0" y1="300" x2="900" y2="300" />
    <line x1="100" y1="0" x2="100" y2="350" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="300" y1="0" x2="300" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="500" y1="0" x2="500" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="700" y1="0" x2="700" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
  </g>

  <!-- Abstract Node Network Decoration on the right -->
  <g transform="translate(650, 100)">
    <path class="link" d="M 50,50 L 150,20 L 200,100 L 100,160 Z" />
    <path class="link" d="M 50,50 L 100,160 L -20,120 Z" />
    <path class="link" d="M 150,20 L 180,-30 L 50,50" />
    
    <circle class="node" cx="50" cy="50" r="3" />
    <circle class="node" cx="150" cy="20" r="4" />
    <circle class="node" cx="200" cy="100" r="2.5" />
    <circle class="node" cx="100" cy="160" r="3.5" />
    <circle class="node" cx="-20" cy="120" r="2" />
    <circle class="node" cx="180" cy="-30" r="3" />
    
    <circle cx="150" cy="20" r="12" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.6" />
    <circle cx="100" cy="160" r="10" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Content -->
  <g transform="translate(60, 80)">
    <!-- Subtitle metadata -->
    <text x="0" y="0" class="subtitle">DATA × AI × RESEARCH × SYSTEMS</text>
    
    <!-- Main Title -->
    <text x="0" y="45" class="title">SARGAM SHARMA</text>
    
    <!-- Year tag right aligned -->
    <text x="760" y="45" class="badge-text" fill="#57606A">2026</text>

    <!-- Description -->
    <text x="0" y="90" class="desc">Building practical intelligent systems from research</text>
    <text x="0" y="115" class="desc">to robust, real-world applications.</text>

    <!-- Credentials Row -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="105" height="26" class="badge-bg" />
      <text x="52.5" y="17" class="badge-text" text-anchor="middle">IIT MADRAS</text>

      <rect x="115" y="0" width="115" height="26" class="badge-bg" />
      <text x="172.5" y="17" class="badge-text" text-anchor="middle">MNIT JAIPUR</text>

      <rect x="240" y="0" width="70" height="26" class="badge-bg" />
      <text x="275" y="17" class="badge-text" text-anchor="middle">AI/ML</text>

      <rect x="320" y="0" width="90" height="26" class="badge-bg" />
      <text x="365" y="17" class="badge-text" text-anchor="middle">RESEARCH</text>
      
      <rect x="420" y="0" width="105" height="26" class="badge-bg" />
      <text x="472.5" y="17" class="badge-text" text-anchor="middle">FULL-STACK</text>
    </g>

    <!-- Links Row -->
    <g transform="translate(0, 210)">
      <text x="0" y="12" class="badge-text" fill="#0969DA">[ PORTFOLIO ]</text>
      <text x="110" y="12" class="badge-text" fill="#0969DA">[ GITHUB ]</text>
      <text x="195" y="12" class="badge-text" fill="#0969DA">[ LINKEDIN ]</text>
      <text x="295" y="12" class="badge-text" fill="#0969DA">[ ORCID ]</text>
    </g>
  </g>
</svg>
